name: Build Sakura dashboard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.8
          cache-dependency-path: upstream/nezha/go.sum

      - name: Install official Linux release toolchain
        run: sudo apt-get update && sudo apt-get install --yes binutils gcc unzip zip

      - name: Install frontend dependencies
        working-directory: upstream/nezha-dash-v2
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        working-directory: upstream/nezha-dash-v2
        run: pnpm run check && pnpm run typecheck && pnpm run test:coverage

      - name: Prepare embedded templates
        run: |
          ./scripts/prepare-official-frontend-dists.sh
          ./scripts/build-sakura-user-dist.sh --skip-install
          ./scripts/check-sakura-template.sh

      - name: Prepare backend resources
        shell: bash
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          version=$(node -p "require('./upstreams.lock.json').backend.version")
          bash ./scripts/prepare-backend-resources.sh "$GITHUB_WORKSPACE" "$version" "${{ matrix.arch }}"

      - name: Verify backend
        working-directory: upstream/nezha
        # Upstream workflow-policy tests require its own CI files, which are
        # intentionally excluded from Sakura's public mirror.
        run: go test ./cmd/... ./model/... ./pkg/... ./service/...

      - name: Build Linux dashboard
        shell: bash
        env:
          GEOIP_DB_PATH: ${{ github.workspace }}/upstream/nezha/pkg/geoip/geoip.db
        run: |
          version=$(node -p "require('./upstreams.lock.json').backend.version")
          bash ./scripts/build-linux-backend.sh "$GITHUB_WORKSPACE" "$version" \
            "$GITHUB_WORKSPACE/dist/dashboard-linux-${{ matrix.arch }}" "${{ matrix.arch }}"
          bash ./scripts/validate-linux-release.sh \
            "$GITHUB_WORKSPACE/dist/dashboard-linux-${{ matrix.arch }}" "$version" "${{ matrix.arch }}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-linux-${{ matrix.arch }}
          path: |
            dist/dashboard-linux-${{ matrix.arch }}
            dist/dashboard-linux-${{ matrix.arch }}.sha256
            dist/dashboard-linux-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated Linux packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dashboard-linux-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/dashboard-linux-amd64.zip
            dist/dashboard-linux-amd64.sha256
            dist/dashboard-linux-arm64.zip
            dist/dashboard-linux-arm64.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
